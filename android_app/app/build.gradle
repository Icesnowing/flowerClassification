plugins {
    alias libs.plugins.android.application
}

android {
    namespace 'com.example.flowerrecognition'
    compileSdk {
        version = release(37)
    }
    // Instrumented 测试走 release 变体 → Gradle 任务为 :app:connectedReleaseAndroidTest（无 connectedDebugAndroidTest）
    testBuildType "release"
    defaultConfig {
        applicationId "com.example.flowerrecognition"
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        debug {
            // 使用默认 debug keystore
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.debug
            optimization {
                enable = false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    // 源码和字符串资源含中文，固定用 UTF-8 编译，不随系统默认编码变化。
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
    androidResources {
        noCompress += 'tflite'
    }
}

dependencies {
    implementation libs.androidx.core
    implementation libs.androidx.activity
    // ActivityResult lint 要求 classpath 上 fragment >= 1.3.0（此前被旧传递依赖解析为 1.1.0）
    implementation libs.androidx.fragment
    implementation 'com.google.ai.edge.litert:litert:2.2.0'
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}

afterEvaluate {
    tasks.register("goldenParityTestFilter") {
        doFirst {
            project.extensions.extraProperties.set(
                    "android.testInstrumentationRunnerArguments.class",
                    "com.example.flowerrecognition.GoldenParityTest")
        }
    }
    tasks.register("connectedGoldenParityTest") {
        group = "verification"
        description = "仅跑 GoldenParityTest（release androidTest，需已连接设备）"
        dependsOn("goldenParityTestFilter", "connectedReleaseAndroidTest")
    }
    tasks.named("connectedReleaseAndroidTest").configure {
        mustRunAfter("goldenParityTestFilter")
    }
}
